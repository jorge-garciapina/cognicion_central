$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:cognicion-central:mrre:segmentation-graph:0.2.0"
title: MRRE Multiscale Segmentation Graph
type: object
additionalProperties: true
required: [schema_version, artifact_id, carrier_ref, units, ordering_edges, containment_edges, segmentation_alternatives, reversibility_test]
properties:
  schema_version: {const: "0.2.0"}
  artifact_id: {type: string, minLength: 1}
  carrier_ref: {type: string, minLength: 1}
  units:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/unit"}
  ordering_edges:
    type: array
    items: {$ref: "#/$defs/edge"}
  containment_edges:
    type: array
    items: {$ref: "#/$defs/edge"}
  overlap_edges:
    type: array
    items: {$ref: "#/$defs/edge"}
  segmentation_alternatives:
    type: array
    items:
      type: object
      required: [alternative_id, material_difference, affected_unit_refs]
      additionalProperties: true
  reversibility_test: {type: string, enum: [PASS, PARTIAL, FAIL, NOT_RUN]}
$defs:
  unit:
    type: object
    required: [unit_id, locator_ref, level, epistemic_status]
    properties:
      unit_id: {type: string}
      locator_ref: {type: string}
      level: {type: string}
      literal_or_digest: {type: [string, "null"]}
      parent_ref: {type: [string, "null"]}
      child_refs: {type: array, items: {type: string}}
      overlaps_with: {type: array, items: {type: string}}
      observable_markers: {type: array, items: {type: string}}
      local_function_hypotheses: {type: array, items: {type: string}}
      epistemic_status: {type: string, enum: [OBSERVATION, SOURCE_ASSERTION, RECONSTRUCTION_CLOSE, STRUCTURAL_INFERENCE]}
  edge:
    type: object
    required: [edge_id, source_ref, target_ref, relation_type]
    properties:
      edge_id: {type: string}
      source_ref: {type: string}
      target_ref: {type: string}
      relation_type: {type: string, enum: [PRECEDES, FOLLOWS, PARENT_OF, CHILD_OF, OVERLAPS]}
