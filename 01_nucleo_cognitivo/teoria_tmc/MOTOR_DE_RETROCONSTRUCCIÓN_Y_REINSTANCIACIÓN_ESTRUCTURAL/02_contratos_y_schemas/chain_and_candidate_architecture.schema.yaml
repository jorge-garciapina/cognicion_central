$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:cognicion-central:mrre:chain-architecture-set:0.2.0"
title: MRRE Chain and Candidate Architecture Set
type: object
additionalProperties: true
required: [schema_version, artifact_id, chains, candidate_architectures, source_trace_refs]
properties:
  schema_version: {const: "0.2.0"}
  artifact_id: {type: string, minLength: 1}
  chains:
    type: array
    items: {$ref: "#/$defs/chain"}
  candidate_architectures:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/architecture"}
  source_trace_refs:
    type: array
    minItems: 1
    items: {type: string}
$defs:
  chain:
    type: object
    required: [chain_id, chain_type, ordered_node_refs, ordered_edge_refs, necessary_conditions, sufficient_conditions, source_bindings, removal_tests, status]
    properties:
      chain_id: {type: string}
      chain_type: {type: string, enum: [causal, enabling, transductive, argumentative, identity, temporal, narrative, control, mixed]}
      ordered_node_refs: {type: array, minItems: 2, items: {type: string}}
      ordered_edge_refs: {type: array, minItems: 1, items: {type: string}}
      entry_state_ref: {type: [string, "null"]}
      exit_state_ref: {type: [string, "null"]}
      necessary_conditions: {type: array, items: {type: string}}
      sufficient_conditions: {type: array, items: {type: string}}
      branch_refs: {type: array, items: {type: string}}
      cycle_refs: {type: array, items: {type: string}}
      source_bindings: {type: array, minItems: 1, items: {type: object, additionalProperties: true}}
      removal_tests:
        type: array
        minItems: 1
        items:
          type: object
          required: [target_ref, operation, expected_loss, verdict]
          properties:
            target_ref: {type: string}
            operation: {type: string, enum: [REMOVE, INVERT, SUBSTITUTE, DELAY]}
            expected_loss: {type: string}
            observed_loss: {type: [string, "null"]}
            verdict: {type: string, enum: [CRITICAL, SUPPORTING, REDUNDANT, SPURIOUS, UNDETERMINED]}
      status: {type: string, enum: [SUPPORTED_STRONG, SUPPORTED_LOCAL, AMBIGUOUS, WEAK, FALSIFIED]}
  architecture:
    type: object
    required: [architecture_id, purpose_hypothesis, member_subgraph_refs, member_chain_refs, topology, invariants_candidate, predictions, falsifiers, unresolved_gaps, alternatives, epistemic_status]
    properties:
      architecture_id: {type: string}
      purpose_hypothesis: {type: string}
      member_subgraph_refs: {type: array, items: {type: string}}
      member_chain_refs: {type: array, items: {type: string}}
      interfaces: {type: array, items: {type: object, additionalProperties: true}}
      topology:
        type: object
        required: [kind, entry_refs, exit_refs]
        properties:
          kind: {type: string, enum: [chain, tree, dag, cyclic_graph, multiplex, hybrid]}
          entry_refs: {type: array, items: {type: string}}
          exit_refs: {type: array, items: {type: string}}
      invariants_candidate: {type: array, items: {type: string}}
      predictions: {type: array, items: {type: string}}
      falsifiers: {type: array, minItems: 1, items: {type: string}}
      unresolved_gaps: {type: array, items: {type: string}}
      alternatives: {type: array, items: {type: string}}
      epistemic_status: {type: string, enum: [RECONSTRUCTION_CLOSE, STRUCTURAL_INFERENCE, DESIGN_HYPOTHESIS]}
