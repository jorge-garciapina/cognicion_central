$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:cognicion-central:mrre:field-cut:0.1.0"
title: MRRE Structural Field and Oriented Cuts
type: object
additionalProperties: true
required: [schema_version, field]
properties:
  schema_version: {const: "0.1.0"}
  field:
    type: object
    additionalProperties: true
    required: [field_id, boundary, layers, nodes, edges, source_bindings, conflicts, missing_regions]
    properties:
      field_id: {type: string}
      identity_statement: {type: string}
      boundary:
        type: object
        required: [in_scope, out_of_scope]
        properties:
          in_scope: {type: array, items: {type: string}}
          out_of_scope: {type: array, items: {type: string}}
          federation_refs: {type: array, items: {type: string}}
      contexts:
        type: array
        items: {type: object, required: [context_id, context_type], additionalProperties: true}
      layers:
        type: array
        items: {type: object, required: [layer_id, layer_type], additionalProperties: true}
      nodes:
        type: array
        items: {$ref: "#/$defs/node"}
      edges:
        type: array
        items: {$ref: "#/$defs/edge"}
      source_bindings:
        type: array
        items: {$ref: "#/$defs/source_binding"}
      conflicts:
        type: array
        items: {type: object, required: [conflict_id, member_refs, status], additionalProperties: true}
      missing_regions:
        type: array
        items: {type: object, required: [region_id, reason], additionalProperties: true}
  cuts:
    type: array
    items:
      type: object
      additionalProperties: true
      required: [cut_id, field_ref, orientation, inclusions, exclusions, prominence, omissions, trace_refs]
      properties:
        cut_id: {type: string}
        field_ref: {type: string}
        orientation:
          type: object
          required: [expected_result_ref]
          properties:
            expected_result_ref: {type: string}
            function: {type: [string, "null"]}
            receiver_profile_ref: {type: [string, "null"]}
        inclusions:
          type: array
          items: {type: object, required: [element_ref, reason], additionalProperties: true}
        exclusions:
          type: array
          items: {type: object, required: [element_ref, reason], additionalProperties: true}
        prominence:
          type: array
          items: {type: object, required: [element_ref, weight], properties: {element_ref: {type: string}, weight: {type: number, minimum: 0, maximum: 1}}}
        omissions:
          type: array
          items: {type: object, required: [region_ref, expected_effect], additionalProperties: true}
        local_roles:
          type: array
          items: {type: object, required: [element_ref, role], additionalProperties: true}
        resolution: {type: string}
        trace_refs: {type: array, minItems: 1, items: {type: string}}
$defs:
  node:
    type: object
    required: [node_id, node_type, epistemic_status]
    properties:
      node_id: {type: string}
      node_type: {type: string}
      label: {type: [string, "null"]}
      epistemic_status: {$ref: "#/$defs/epistemic_status"}
      context_refs: {type: array, items: {type: string}}
  edge:
    type: object
    required: [edge_id, source_ref, target_ref, relation_type, epistemic_status]
    properties:
      edge_id: {type: string}
      source_ref: {type: string}
      target_ref: {type: string}
      relation_type: {type: string}
      directed: {type: boolean, default: true}
      conditions: {type: array, items: {type: string}}
      epistemic_status: {$ref: "#/$defs/epistemic_status"}
  source_binding:
    type: object
    required: [element_ref, source_ref, locator]
    properties:
      element_ref: {type: string}
      source_ref: {type: string}
      locator: {type: object, additionalProperties: true}
  epistemic_status:
    type: string
    enum: [observation, source_assertion, synthesis, inference, hypothesis, human_decision, run_result]

