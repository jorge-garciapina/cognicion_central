$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:cognicion-central:mrre:epistemic-trace:0.1.0"
title: MRRE Epistemic Trace Graph
type: object
additionalProperties: true
required: [schema_version, trace_id, run_id, events, graph_edges, coverage]
properties:
  schema_version: {const: "0.1.0"}
  trace_id: {type: string}
  run_id: {type: string}
  events:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: true
      required: [event_id, timestamp, actor, operation, input_refs, output_refs, epistemic_status]
      properties:
        event_id: {type: string}
        timestamp: {type: string, format: date-time}
        actor: {type: object, required: [actor_id, actor_kind], additionalProperties: true}
        operation: {type: string}
        input_refs: {type: array, items: {type: string}}
        output_refs: {type: array, items: {type: string}}
        source_spans: {type: array, items: {type: object, additionalProperties: true}}
        epistemic_status:
          type: string
          enum: [observation, source_assertion, synthesis, inference, hypothesis, recommendation, human_decision, run_result, promoted_knowledge]
        inferential_rule: {type: [string, "null"]}
        alternatives: {type: array, items: {type: string}}
        confidence: {type: [number, "null"], minimum: 0, maximum: 1}
        human_decision_ref: {type: [string, "null"]}
        version: {type: string}
        input_hashes: {type: array, items: {type: object, additionalProperties: true}}
        output_hashes: {type: array, items: {type: object, additionalProperties: true}}
  graph_edges:
    type: array
    items:
      type: object
      required: [edge_id, source_ref, target_ref, relation_type]
      properties:
        edge_id: {type: string}
        source_ref: {type: string}
        target_ref: {type: string}
        relation_type: {type: string, enum: [derived_from, supports, contradicts, abstracts, binds, realizes, validates, supersedes, decided_by, generated_by]}
        resolution_change: {type: [string, "null"]}
  coverage:
    type: object
    required: [forward_complete, backward_complete, untraced_claim_refs]
    properties:
      forward_complete: {type: boolean}
      backward_complete: {type: boolean}
      untraced_claim_refs: {type: array, items: {type: string}}
      measured_at: {type: [string, "null"], format: date-time}

