$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:cognicion-central:mrre:result:0.1.0"
title: MRRE Result Envelope
type: object
additionalProperties: true
required: [schema_version, result_id, run_id, request_ref, operation, state, artifacts, alternatives, uncertainties, validation, trace_refs, promotion_status]
properties:
  schema_version: {const: "0.1.0"}
  result_id: {type: string}
  run_id: {type: string}
  request_ref: {type: string}
  case_spec_ref: {type: [string, "null"]}
  execution_plan_ref: {type: [string, "null"]}
  operation: {type: string, enum: [RETROCONSTRUIR, REINSTANCIAR, COMPARAR, TRIANGULAR, VALIDAR]}
  state:
    type: string
    enum: [COMPLETED, PARTIAL, ALTERNATIVES_PENDING, WAITING_HUMAN_DECISION, FAILED_RECOVERABLE, FAILED_TERMINAL, REVALIDATION_REQUIRED]
  artifacts:
    type: object
    additionalProperties: true
    properties:
      field_refs: {type: array, items: {type: string}}
      cut_refs: {type: array, items: {type: string}}
      segmentation_refs: {type: array, items: {type: string}}
      subgraph_refs: {type: array, items: {type: string}}
      chain_refs: {type: array, items: {type: string}}
      candidate_architecture_refs: {type: array, items: {type: string}}
      skeleton_refs: {type: array, items: {type: string}}
      binding_refs: {type: array, items: {type: string}}
      reinstantiation_refs: {type: array, items: {type: string}}
      comparison_refs: {type: array, items: {type: string}}
  alternatives:
    type: array
    items: {type: object, required: [alternative_id, status, material_difference], additionalProperties: true}
  uncertainties:
    type: array
    items: {type: object, required: [uncertainty_id, layer, statement, impact], additionalProperties: true}
  failures:
    type: array
    items: {type: object, required: [failure_id, type, severity, recoverable], additionalProperties: true}
  validation:
    type: object
    required: [verification_status, purpose_validation_status, validator_result_refs]
    properties:
      verification_status: {type: string, enum: [passed, failed, partial, not_run]}
      purpose_validation_status: {type: string, enum: [passed, failed, partial, not_run]}
      validator_result_refs: {type: array, items: {type: string}}
      evidence_sufficient: {type: boolean}
      authorized_for_promotion: {type: boolean, const: false}
  trace_refs:
    type: array
    minItems: 1
    items: {type: string}
  consumer_handoff:
    type: [object, "null"]
    additionalProperties: true
  promotion_status:
    type: string
    enum: [NOT_REQUESTED, CANDIDATE, WAITING_HUMAN_DECISION, REJECTED, PROMOTED]
allOf:
  - if:
      properties: {state: {const: COMPLETED}}
    then:
      properties:
        validation:
          properties:
            verification_status: {enum: [passed, partial]}
