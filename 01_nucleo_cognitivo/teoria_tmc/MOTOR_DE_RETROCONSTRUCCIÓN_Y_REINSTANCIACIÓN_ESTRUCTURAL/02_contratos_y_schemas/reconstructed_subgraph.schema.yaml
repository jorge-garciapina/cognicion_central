$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:cognicion-central:mrre:reconstructed-subgraph:0.1.0"
title: MRRE Reconstructed Subgraph of Effect
type: object
additionalProperties: true
required: [schema_version, subgraph_id, focal_node, related_nodes, typed_edges, dependencies, context, epistemic_status, source_bindings, alternatives]
properties:
  schema_version: {const: "0.1.0"}
  subgraph_id: {type: string}
  graph_kind: {type: string, enum: [knowledge, discursive, projected, realized, activated, updated, mixed_candidate]}
  focal_node: {$ref: "#/$defs/node"}
  related_nodes:
    type: array
    items: {$ref: "#/$defs/node"}
  typed_edges:
    type: array
    items: {$ref: "#/$defs/edge"}
  dependencies:
    type: object
    required: [prior, simultaneous, subsequent, presupposed]
    properties:
      prior: {type: array, items: {type: string}}
      simultaneous: {type: array, items: {type: string}}
      subsequent: {type: array, items: {type: string}}
      presupposed: {type: array, items: {type: string}}
  input_state: {type: [object, "null"], additionalProperties: true}
  projected_output_state: {type: [object, "null"], additionalProperties: true}
  trajectory_position:
    type: object
    additionalProperties: true
    properties:
      order: {type: [integer, "null"], minimum: 0}
      predecessor_refs: {type: array, items: {type: string}}
      successor_refs: {type: array, items: {type: string}}
  context: {type: object, additionalProperties: true}
  function_hypotheses:
    type: array
    items: {$ref: "#/$defs/hypothesis"}
  effect_hypotheses:
    type: array
    items: {$ref: "#/$defs/hypothesis"}
  observer_contributions:
    type: array
    items: {type: object, required: [observer_id, claim_refs], additionalProperties: true}
  epistemic_status:
    type: string
    enum: [reconstruction_close, reconstruction_traceable, structural_inference, design_hypothesis, receiver_evidence]
  source_bindings:
    type: array
    minItems: 1
    items: {type: object, required: [source_ref, locator, supports], additionalProperties: true}
  alternatives:
    type: array
    items: {type: object, required: [alternative_id, material_difference, status], additionalProperties: true}
  confidence:
    type: object
    required: [value, method, scope]
    properties:
      value: {type: number, minimum: 0, maximum: 1}
      method: {type: string}
      scope: {type: string}
      calibration_ref: {type: [string, "null"]}
  nested_subgraph_refs: {type: array, items: {type: string}}
  parent_subgraph_ref: {type: [string, "null"]}
$defs:
  node:
    type: object
    required: [node_id, node_type]
    properties:
      node_id: {type: string}
      node_type: {type: string}
      payload_ref: {type: [string, "null"]}
      local_role: {type: [string, "null"]}
  edge:
    type: object
    required: [edge_id, source_ref, target_ref, relation_type, evidence_refs]
    properties:
      edge_id: {type: string}
      source_ref: {type: string}
      target_ref: {type: string}
      relation_type: {type: string}
      direction: {type: string, enum: [forward, backward, bidirectional, undirected, conditional]}
      evidence_refs: {type: array, items: {type: string}}
  hypothesis:
    type: object
    required: [hypothesis_id, statement, evidence_refs, falsifiers]
    properties:
      hypothesis_id: {type: string}
      statement: {type: string}
      evidence_refs: {type: array, items: {type: string}}
      falsifiers: {type: array, items: {type: string}}

